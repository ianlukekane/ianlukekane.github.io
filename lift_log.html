<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#0C0F14">
<title>Lift Log</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
:root{
  --bg:#0C0F14;--s0:#161C24;--s1:#1D2530;--bd:rgba(255,255,255,.08);
  --a:#FF6B35;--a2:rgba(255,107,53,.15);
  --bl:#4A90E2;--bl2:rgba(74,144,226,.15);
  --gn:#22C55E;--gn2:rgba(34,197,94,.15);
  --gy:#4B5563;--gy2:rgba(75,85,99,.18);
  --t:#EEF2F7;--t2:#7E8894;--t3:#2E3540;
  --r:14px;--rs:9px;
  --fd:'Barlow Condensed',system-ui,-apple-system,sans-serif;--fb:'DM Sans',system-ui,-apple-system,sans-serif;
  --si:env(safe-area-inset-top,59px);--sb:env(safe-area-inset-bottom,34px)
}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--fb);overflow:hidden;font-size:16px;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{height:100%;max-width:430px;margin:0 auto;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.view.off{transform:translateX(105%);pointer-events:none}
.card{background:var(--s0);border-radius:var(--r);border:1.5px solid var(--bd)}
.sl{font-size:10px;font-weight:500;color:var(--t2);letter-spacing:.09em;text-transform:uppercase}
[onclick]{cursor:pointer;touch-action:manipulation}
[onclick]:active{opacity:.7}
input,select,textarea{user-select:text;-webkit-user-select:text}
input[type=number]{-webkit-appearance:none;-moz-appearance:textfield;appearance:none}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
</style>
</head>
<body>
<div id="app">
  <div id="vw" class="view"></div>
  <div id="vo" class="view off"></div>
</div>
<script>
// ── PLAN DATA ────────────────────────────────────────────────────────────────
// Indexed by JS getDay(): 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat
const PLAN = [
  { // 0 — Sunday
    key: 'zone2', name: 'Zone 2 Run', type: 'cardio',
    focus: 'Aerobic base & fat oxidation',
    blocks: [
      { time: '5 min',     label: 'Walk warm-up',       desc: 'Brisk walking with arm swings. Elevates HR and loosens hip flexors before running.' },
      { time: '25–35 min', label: 'Zone 2 run',         desc: "Easy conversational pace — 60–70% max HR (~105–120 bpm). If you can't hold a full sentence, slow down. True zone 2 feels almost too easy — that's correct." },
      { time: '3–4 min',   label: 'Strides (optional)', desc: '3–4 × 25 sec accelerations to ~80% effort with 45 sec walk recovery each. Improves running economy without meaningful fatigue cost.' },
    ],
  },
  { // 1 — Monday
    key: 'upper_a', name: 'Upper A', type: 'strength',
    focus: 'Horizontal push & pull',
    warmup: '3 min jump rope · Arm circles 30s each direction · Shoulder pass-through 10 reps · 15 scapular push-ups on floor',
    exercises: [
      { id: 'floor_press',  name: 'DB Floor Press',      numSets: 4, target: '8–12',   note: 'Superset with row — rest 75s between supersets' },
      { id: 'bent_row',     name: 'DB Bent-Over Row',    numSets: 4, target: '8–12',   note: 'Superset with press — flat back, brace core' },
      { id: 'arnold_press', name: 'Arnold Press',        numSets: 3, target: '10–12',  note: 'Full rotation through range of motion' },
      { id: 'lat_raise',    name: 'Lateral Raise',       numSets: 3, target: '12–15',  note: 'Lead with elbows, brief pause at top' },
      { id: 'tricep_ext',   name: 'Tricep Overhead Ext', numSets: 3, target: '12–15',  note: 'Hold one heavier DB with both hands' },
      { id: 'hammer_curl',  name: 'Hammer Curl',         numSets: 3, target: '12–15',  note: 'Neutral grip, full range, no swinging' },
    ],
    core: 'Plank 3 × 40 sec · Dead Bug 2 × 8 each side',
  },
  { // 2 — Tuesday
    key: 'hiit', name: 'HIIT Cardio', type: 'cardio',
    focus: 'High-intensity intervals · Jump rope',
    blocks: [
      { time: '4 min',  label: 'Warm-up',   desc: 'Easy single-bounce jumping to warm ankles and calves. No double-unders yet.' },
      { time: '20 min', label: '8 rounds',  desc: '40 sec intense (double-unders, high knees, or fast alternating feet) / 20 sec rest. Target 80–90% max HR (~155–165 bpm). Rounds 5–8: replace rest with 10 push-ups or 15 air squats.' },
      { time: '4 min',  label: 'Cool-down', desc: 'Easy jumping tapering to walk. Calf stretch, hip flexor hold, shoulder cross-stretch — 90 sec each.' },
    ],
  },
  { // 3 — Wednesday
    key: 'lower_a', name: 'Lower A', type: 'strength',
    focus: 'Quad-dominant · Knee flexion',
    warmup: '3 min jump rope · Hip circles 10 each direction · Leg swings 10 each leg · 15 bodyweight squats · 10 glute bridges',
    exercises: [
      { id: 'goblet_squat',  name: 'Goblet Squat',        numSets: 4, target: '10–12', note: 'Hold DB at chest; chest up, aim for parallel or below' },
      { id: 'rdl',           name: 'Romanian Deadlift',   numSets: 3, target: '10–12', note: 'Hinge at hips with soft knees; push hips back' },
      { id: 'walking_lunge', name: 'Walking Lunges',      numSets: 3, target: '12/leg',note: 'Lower rear knee toward floor, drive through front heel' },
      { id: 'step_ups',      name: 'Step-Ups',            numSets: 3, target: '10/leg',note: 'Stairs or sturdy chair; full hip extension at top' },
      { id: 'calf_raise',    name: 'Standing Calf Raise', numSets: 3, target: '15–20', note: 'Hold DBs at sides; slow 3-second eccentric' },
    ],
    core: 'Hollow Body Hold 3 × 20 sec · Bicycle Crunch 3 × 12 each side',
  },
  { // 4 — Thursday
    key: 'rest', name: 'Rest & Recovery', type: 'rest',
    focus: 'Active recovery · Tissue quality',
    items: [
      { icon: '🚶', title: 'Easy walk',             desc: 'Your 7,200 step baseline is already doing the work. Extend by 15–20 min if energy allows — conversational pace only.' },
      { icon: '🔄', title: 'Mobility work',         desc: 'Hip flexor kneeling stretch 30s/side · Thoracic rotation 10 each · Shoulder 90/90 30s each. About 12 minutes total.' },
      { icon: '〰',  title: 'Foam rolling',          desc: 'Quads, IT band, lats, thoracic spine — 45–60 sec per area. Skip areas with acute or sharp soreness.' },
      { icon: '💧', title: 'Hydration & nutrition',  desc: 'Keep protein on target and stay well hydrated. Recovery happens between sessions, not during them.' },
    ],
  },
  { // 5 — Friday
    key: 'upper_b', name: 'Upper B', type: 'strength',
    focus: 'Vertical push · Shoulder health',
    warmup: '3 min jump rope · Neck rolls · Thoracic rotation 10 each · Shoulder 90/90 30s each · 10 prone Y raises (no weight)',
    exercises: [
      { id: 'push_press',      name: 'DB Push Press',            numSets: 4, target: '8–10',  note: 'Small leg drive to initiate — power movement' },
      { id: 'rev_fly',         name: 'Bent-Over Reverse Fly',    numSets: 3, target: '12–15', note: 'Light weight, full ROM, squeeze & pause at top' },
      { id: 'neutral_press',   name: 'Neutral-Grip Floor Press', numSets: 3, target: '10–12', note: 'Palms facing each other throughout' },
      { id: 'floor_face_pull', name: 'Floor Face Pull (Prone)',  numSets: 2, target: '12–15', note: 'Face-down, pull DBs toward ears, elbows wide' },
      { id: 'skull_crusher',   name: 'Skull Crusher',            numSets: 3, target: '12',    note: 'Lower to temples slowly, elbows above shoulders' },
      { id: 'zottman_curl',    name: 'Zottman Curl',             numSets: 3, target: '10–12', note: 'Supinate (palms up) lifting, pronate (palms down) lowering' },
    ],
    core: 'Russian Twist 3 × 15 each side · Side Plank 2 × 30 sec each',
  },
  { // 6 — Saturday
    key: 'lower_b', name: 'Lower B', type: 'strength',
    focus: 'Posterior chain · Hip hinge',
    warmup: '3 min jump rope · 15 bodyweight glute bridges · Clamshells 15 each side · Hip flexor stretch 30s each · Cat-cow 10 reps',
    exercises: [
      { id: 'deadlift',     name: 'Conventional Deadlift', numSets: 4, target: '6–8',     note: 'Heavier than RDL — near-max safe load; engage lats' },
      { id: 'bss',          name: 'Bulgarian Split Squat', numSets: 3, target: '8–10/leg', note: 'Rear foot on couch; lean torso forward for glutes' },
      { id: 'hip_thrust',   name: 'Hip Thrust',            numSets: 3, target: '15',       note: 'Shoulders on floor, DB on hip crease, drive through heels' },
      { id: 'lat_lunge',    name: 'Lateral Lunge',         numSets: 3, target: '10/side',  note: 'Step wide, hinge into working leg, stretch adductor' },
      { id: 'good_morning', name: 'Good Morning',          numSets: 2, target: '12',       note: 'DB at chest, soft knees, hinge to hamstring pull' },
      { id: 'seated_calf',  name: 'Seated Calf Raise',     numSets: 3, target: '15–20',    note: 'DB on knee — hits soleus vs. standing version' },
    ],
    core: 'Bird Dog 3 × 10 each side · Copenhagen Plank 2 × 20 sec each',
  },
];

const DAY_ABBR  = ['S','M','T','W','T','F','S'];
const DAY_FULL  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS    = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ── STORAGE ───────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'liftlog_v1';

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; }
}
function save(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

// Returns a YYYY-MM-DD string for a given Date (or today), using local time
// components so the key always matches the user's calendar regardless of timezone.
function toDateKey(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Ensure a session entry exists for dateKey/workoutKey, pre-filling set weights
// from the most recent prior session of the same workout type.
// Mutates `data` in place and saves if a new entry is created.
// Returns the session object directly so callers don't need a second load().
function ensureSession(data, dateKey, workoutKey) {
  if (!data[dateKey]) data[dateKey] = {};
  if (!data[dateKey][workoutKey]) {
    const plan = PLAN[new Date(dateKey + 'T12:00:00').getDay()];
    const sets = {};
    if (plan.exercises) {
      const prevSets = Object.entries(data)
        .filter(([d, v]) => d < dateKey && v[workoutKey]?.sets)
        .sort(([a], [b]) => b.localeCompare(a))[0]?.[1]?.[workoutKey]?.sets || {};
      plan.exercises.forEach(ex => {
        const prev = prevSets[ex.id] || [];
        sets[ex.id] = Array.from({ length: ex.numSets }, (_, i) => ({
          w: prev[i]?.w || '', r: prev[i]?.r || '', done: false,
        }));
      });
    }
    data[dateKey][workoutKey] = { done: false, sets };
    save(data);
  }
  return data[dateKey][workoutKey];
}

function updateSet(dateKey, workoutKey, exId, setIndex, field, value) {
  const data = load();
  const set = data[dateKey]?.[workoutKey]?.sets?.[exId]?.[setIndex];
  if (!set) return;
  set[field] = value;
  save(data);
}

function toggleSetCompleted(dateKey, workoutKey, exId, setIndex) {
  const data = load();
  const set = data[dateKey]?.[workoutKey]?.sets?.[exId]?.[setIndex];
  if (!set) return;
  set.done = !set.done;
  save(data);
}

function markWorkoutDone(dateKey, workoutKey) {
  const data = load();
  if (!data[dateKey]) data[dateKey] = {};
  if (!data[dateKey][workoutKey]) data[dateKey][workoutKey] = {};
  data[dateKey][workoutKey].done = true;
  save(data);
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let weekOffset = 0;    // 0 = current week, -1 = previous week, etc.
let openDate   = null; // ISO date string of the workout being viewed
let openDay    = null; // getDay() index of the workout being viewed
let expandedId = null; // exercise id currently expanded in the workout view

// ── UTILS ─────────────────────────────────────────────────────────────────────
function mondayOf(offset = 0) {
  const d   = new Date();
  const dow = d.getDay();
  d.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1) + offset * 7);
  d.setHours(0, 0, 0, 0);
  return d;
}

function fmtDate(d) {
  return `${DAY_SHORT[d.getDay()]} ${MONTHS[d.getMonth()]} ${d.getDate()}`;
}

const TYPE_META = {
  strength: { color: 'var(--bl)', bg: 'var(--bl2)', label: 'STRENGTH' },
  cardio:   { color: 'var(--gn)', bg: 'var(--gn2)', label: 'CARDIO' },
  rest:     { color: 'var(--gy)', bg: 'var(--gy2)', label: 'REST DAY' },
};

// ── WEEK VIEW ─────────────────────────────────────────────────────────────────
function renderWeek() {
  const data     = load();  // single load for the entire render
  const today    = new Date(); today.setHours(0, 0, 0, 0);
  const todayKey = toDateKey(today);
  const todayDay = today.getDay();
  const mon      = mondayOf(weekOffset);

  // week[0]=Mon … week[6]=Sun
  const week = Array.from({ length: 7 }, (_, i) => {
    const d      = new Date(mon); d.setDate(mon.getDate() + i);
    const dayNum = (i + 1) % 7;  // Mon→1, Tue→2, …, Sat→6, Sun→0
    return { d, dayNum, plan: PLAN[dayNum], dateKey: toDateKey(d) };
  });

  const todayPlan = PLAN[todayDay];
  const todayDone = data[todayKey]?.[todayPlan.key]?.done || false;

  const stripCells = week.map(({ d, dayNum, plan, dateKey }) => {
    const isToday  = dateKey === todayKey;
    const done     = data[dateKey]?.[plan.key]?.done || false;
    const dotColor = done ? 'var(--a)' : TYPE_META[plan.type].color;
    return `<div onclick="openWorkout('${dateKey}',${dayNum})" style="background:var(--s0);border-radius:10px;padding:8px 2px 9px;text-align:center;border:${isToday ? '1.5px solid var(--a)' : '1.5px solid var(--bd)'}">
  <span style="font-size:10px;color:var(--t2);display:block;margin-bottom:3px">${DAY_ABBR[d.getDay()]}</span>
  <span style="width:7px;height:7px;border-radius:50%;background:${dotColor};display:block;margin:0 auto 4px"></span>
  <span style="font-size:11px;color:${isToday ? 'var(--t)' : 'var(--t2)'}">${d.getDate()}</span>
</div>`;
  }).join('');

  const cta    = todayPlan.type === 'strength' ? (todayDone ? 'Review workout' : 'Start workout →')
               : todayPlan.type === 'cardio'   ? (todayDone ? 'Completed ✓'   : 'Log session →')
               : 'View activities';
  const ctaBg  = todayDone ? 'var(--gn2)' : 'var(--a)';
  const ctaClr = todayDone ? 'var(--gn)' : '#fff';

  const dayRows = week.map(({ d, dayNum, plan, dateKey }) => {
    const isToday = dateKey === todayKey;
    const done    = data[dateKey]?.[plan.key]?.done || false;
    return `<div onclick="openWorkout('${dateKey}',${dayNum})" style="background:var(--s0);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;border:1.5px solid ${isToday ? 'rgba(255,107,53,.35)' : 'var(--bd)'};margin-bottom:8px">
  <span style="width:10px;height:10px;border-radius:50%;background:${TYPE_META[plan.type].color};flex-shrink:0"></span>
  <div style="flex:1;min-width:0">
    <div style="font-family:var(--fd);font-size:18px;font-weight:600;letter-spacing:.02em;color:var(--t)">${DAY_FULL[d.getDay()]}</div>
    <div style="font-size:12px;color:var(--t2);margin-top:1px">${plan.name}${plan.focus ? ' · ' + plan.focus : ''}</div>
  </div>
  ${done ? `<span style="color:var(--gn);font-size:20px">✓</span>` : `<span style="color:var(--t3);font-size:22px">›</span>`}
</div>`;
  }).join('');

  const sunday    = new Date(mon); sunday.setDate(mon.getDate() + 6);
  const weekLabel = `${MONTHS[mon.getMonth()]} ${mon.getDate()} – ${MONTHS[sunday.getMonth()]} ${sunday.getDate()}`;

  document.getElementById('vw').innerHTML = `
<div style="padding:calc(env(safe-area-inset-top,59px)+14px) 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
  <div style="font-family:var(--fd);font-size:32px;font-weight:700;letter-spacing:.04em;color:var(--t)">LIFT LOG</div>
  <div style="display:flex;align-items:center;gap:10px">
    <div onclick="prevWeek()" style="width:32px;height:32px;border-radius:50%;background:var(--s0);display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bd);font-size:18px;color:var(--t2)">‹</div>
    <div style="font-size:12px;color:var(--t2);text-align:center;min-width:90px">${weekLabel}</div>
    <div onclick="nextWeek()" style="width:32px;height:32px;border-radius:50%;background:var(--s0);display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bd);font-size:18px;color:${weekOffset < 0 ? 'var(--t2)' : 'var(--t3)'}">›</div>
  </div>
</div>

<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 16px 14px">${stripCells}</div>

<div style="padding:0 16px 14px">
<div class="sl" style="margin-bottom:10px">Today · ${fmtDate(today)}</div>
<div onclick="openWorkout('${todayKey}',${todayDay})" style="background:var(--s0);border-radius:var(--r);padding:20px;border:1.5px solid var(--bd);position:relative">
  <div style="font-size:11px;font-weight:700;font-family:var(--fd);letter-spacing:.12em;color:${TYPE_META[todayPlan.type].color};margin-bottom:5px">${TYPE_META[todayPlan.type].label}</div>
  <div style="font-family:var(--fd);font-size:44px;font-weight:700;letter-spacing:.02em;color:var(--t);line-height:1;margin-bottom:4px">${todayPlan.name.toUpperCase()}</div>
  ${todayPlan.focus ? `<div style="font-size:13px;color:var(--t2);margin-bottom:18px">${todayPlan.focus}</div>` : `<div style="margin-bottom:18px"></div>`}
  <span style="display:inline-block;background:${ctaBg};color:${ctaClr};font-size:14px;font-weight:500;padding:10px 22px;border-radius:50px">${cta}</span>
  ${todayDone ? `<span style="position:absolute;top:16px;right:16px;background:var(--gn2);color:var(--gn);font-size:11px;font-weight:700;font-family:var(--fd);letter-spacing:.06em;padding:4px 10px;border-radius:50px">DONE</span>` : ''}
</div>
</div>

<div style="padding:0 16px">
<div class="sl" style="margin-bottom:10px">This week</div>
${dayRows}
</div>
<div style="height:calc(env(safe-area-inset-bottom,34px)+24px)"></div>`;
}

// ── WORKOUT VIEW ──────────────────────────────────────────────────────────────
function renderWorkout() {
  const plan = PLAN[openDay];
  const meta = TYPE_META[plan.type];
  let body   = '';

  if (plan.type === 'strength') {
    const data    = load();  // single load for the entire render
    const session = ensureSession(data, openDate, plan.key);

    // Find the previous session once, outside the exercise loop.
    const prevSession = Object.entries(data)
      .filter(([d, v]) => d < openDate && v[plan.key]?.sets)
      .sort(([a], [b]) => b.localeCompare(a))[0]?.[1]?.[plan.key];

    body += `<div style="margin:12px 16px 0;background:var(--s0);border-radius:var(--r);padding:14px 16px;border:1.5px solid var(--bd)">
<div class="sl" style="margin-bottom:6px">Warm-up · 8–10 min</div>
<div style="font-size:13px;color:var(--t2);line-height:1.65">${plan.warmup}</div>
</div>
<div style="padding:14px 16px 0"><div class="sl" style="margin-bottom:10px">Main work</div>`;

    plan.exercises.forEach((ex, index) => {
      const sets      = session.sets?.[ex.id] || Array.from({ length: ex.numSets }, () => ({ w: '', r: '', done: false }));
      const isOpen    = expandedId === ex.id;
      const allDone   = sets.every(s => s.done);
      const doneCount = sets.filter(s => s.done).length;
      const lastSets  = prevSession?.sets?.[ex.id] || null;
      const prevText  = lastSets?.[0]?.w ? `Last: ${lastSets[0].w} lbs` : 'First session';
      const pips      = sets.map(s =>
        `<span style="width:6px;height:6px;border-radius:50%;background:${s.done ? 'var(--gn)' : 'var(--t3)'}"></span>`
      ).join('');

      body += `<div id="ex-${ex.id}" style="background:var(--s0);border-radius:var(--r);border:1.5px solid ${allDone ? 'rgba(34,197,94,.35)' : 'var(--bd)'};margin-bottom:8px;overflow:hidden">
<div onclick="toggleExercise('${ex.id}')" style="padding:14px 16px;display:flex;align-items:flex-start;gap:10px">
  <span style="font-family:var(--fd);font-size:15px;font-weight:700;color:var(--t3);width:20px;flex-shrink:0;padding-top:1px">${index + 1}</span>
  <div style="flex:1;min-width:0">
    <div style="font-size:15px;font-weight:500;color:var(--t);line-height:1.2">${ex.name}</div>
    <div style="font-size:12px;color:var(--t2);margin-top:2px">${ex.note}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:5px;flex-wrap:wrap">
      <span style="font-size:12px;color:var(--t2)">${ex.numSets} sets × ${ex.target}</span>
      <span style="font-size:11px;color:${lastSets?.[0]?.w ? 'var(--a)' : 'var(--t3)'}">${prevText}</span>
    </div>
    <div style="display:flex;gap:4px;margin-top:6px;align-items:center">${pips}<span style="font-size:11px;color:var(--t2);margin-left:4px">${doneCount}/${ex.numSets}</span></div>
  </div>
  <span style="color:var(--t3);font-size:18px;flex-shrink:0;transition:transform .2s;margin-top:1px;${isOpen ? 'transform:rotate(180deg)' : ''}">⌄</span>
</div>
${isOpen ? renderSets(ex, sets) : ''}
</div>`;
    });

    body += `</div><div style="margin:4px 16px 0;background:var(--s0);border-radius:var(--r);padding:14px 16px;border:1.5px solid var(--bd)">
<div class="sl" style="margin-bottom:6px">Core finisher</div>
<div style="font-size:13px;color:var(--t2);line-height:1.6">${plan.core}</div>
</div>`;

    const allExDone = plan.exercises.every(ex => {
      const s = session.sets?.[ex.id] || [];
      return s.length > 0 && s.every(x => x.done);
    });
    const isDone = data[openDate]?.[plan.key]?.done || false;
    body += `<div id="cbtn" onclick="completeWorkout()" style="margin:16px 16px calc(env(safe-area-inset-bottom,34px)+16px);padding:16px;background:${isDone ? 'var(--gn2)' : allExDone ? 'var(--gn)' : 'var(--a)'};color:${isDone ? 'var(--gn)' : '#fff'};font-size:18px;font-weight:600;font-family:var(--fd);letter-spacing:.06em;text-transform:uppercase;border-radius:50px;text-align:center">
${isDone ? '✓ Workout complete' : allExDone ? 'Complete workout ✓' : 'Complete workout'}
</div>`;

  } else if (plan.type === 'cardio') {
    const data   = load();
    const isDone = data[openDate]?.[plan.key]?.done || false;
    body += `<div style="padding:12px 16px 0;display:flex;flex-direction:column;gap:10px">`;
    plan.blocks.forEach(b => {
      body += `<div style="background:var(--s0);border-radius:var(--r);padding:16px;border:1.5px solid var(--bd);display:grid;grid-template-columns:70px 1fr;gap:8px 14px;align-items:start">
<div>
  <div style="font-family:var(--fd);font-size:22px;font-weight:700;color:var(--t);text-align:right;line-height:1.1">${b.time}</div>
  <div style="font-size:11px;color:var(--t2);text-align:right;margin-top:2px">${b.label}</div>
</div>
<div style="border-left:2px solid var(--bd);padding-left:14px;font-size:13px;color:var(--t);line-height:1.6">${b.desc}</div>
</div>`;
    });
    body += `</div>
<div id="cbtn" onclick="completeWorkout()" style="margin:16px 16px calc(env(safe-area-inset-bottom,34px)+16px);padding:16px;background:${isDone ? 'var(--gn2)' : 'var(--gn)'};color:${isDone ? 'var(--gn)' : '#fff'};font-size:18px;font-weight:600;font-family:var(--fd);letter-spacing:.06em;text-transform:uppercase;border-radius:50px;text-align:center">
${isDone ? '✓ Session complete' : 'Mark session done'}
</div>`;

  } else { // rest day
    body += `<div style="padding:12px 16px 0;display:flex;flex-direction:column;gap:10px">`;
    plan.items.forEach(item => {
      body += `<div style="background:var(--s0);border-radius:var(--r);padding:16px;border:1.5px solid var(--bd);display:flex;gap:12px;align-items:flex-start">
<div style="font-size:26px;flex-shrink:0">${item.icon}</div>
<div>
  <div style="font-size:15px;font-weight:500;color:var(--t);margin-bottom:3px">${item.title}</div>
  <div style="font-size:13px;color:var(--t2);line-height:1.55">${item.desc}</div>
</div>
</div>`;
    });
    body += `</div><div style="height:calc(env(safe-area-inset-bottom,34px)+20px)"></div>`;
  }

  const dateDisp = fmtDate(new Date(openDate + 'T12:00:00'));
  document.getElementById('vo').innerHTML = `
<div style="padding:calc(env(safe-area-inset-top,59px)+14px) 16px 12px;display:flex;align-items:center;gap:12px;flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--bd)">
  <div onclick="closeWorkout()" style="width:36px;height:36px;border-radius:50%;background:var(--s1);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;color:var(--t)">‹</div>
  <div style="flex:1;min-width:0">
    <div style="font-family:var(--fd);font-size:26px;font-weight:700;letter-spacing:.03em;color:var(--t);line-height:1">${plan.name.toUpperCase()}</div>
    <div style="font-size:12px;color:var(--t2);margin-top:2px">${dateDisp}${plan.focus ? ' · ' + plan.focus : ''}</div>
  </div>
  <div style="background:${meta.bg};color:${meta.color};font-size:11px;font-weight:700;font-family:var(--fd);letter-spacing:.08em;padding:4px 10px;border-radius:50px;flex-shrink:0">${meta.label}</div>
</div>
${body}`;
}

function renderSets(ex, sets) {
  let html = '<div style="border-top:1px solid var(--bd);padding:8px 16px 12px">';
  sets.forEach((set, i) => {
    const done       = set.done;
    const inputStyle = `background:${done ? 'var(--gn2)' : 'var(--s1)'};border:1.5px solid ${done ? 'rgba(34,197,94,.3)' : 'var(--bd)'};color:${done ? 'var(--gn)' : 'var(--t)'};width:100%;border-radius:var(--rs);font-family:var(--fb);font-size:16px;text-align:center;padding:8px 4px;outline:none`;
    html += `<div style="display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center;padding:7px 0;border-bottom:${i < sets.length - 1 ? '1px solid var(--bd)' : 'none'}">
<span style="font-size:12px;color:var(--t2);text-align:center">${i + 1}</span>
<div>
  <div style="font-size:10px;color:var(--t3);text-align:center;margin-bottom:3px">lbs</div>
  <input type="number" inputmode="decimal" min="0" step="2.5" placeholder="—" value="${set.w || ''}"
    style="${inputStyle}" oninput="onWeightInput(event,'${ex.id}',${i})">
</div>
<div>
  <div style="font-size:10px;color:var(--t3);text-align:center;margin-bottom:3px">reps</div>
  <input type="number" inputmode="numeric" min="0" step="1" placeholder="—" value="${set.r || ''}"
    style="${inputStyle}" oninput="onRepsInput(event,'${ex.id}',${i})">
</div>
<div onclick="toggleSetDone('${ex.id}',${i})" style="width:40px;height:40px;border-radius:50%;background:${done ? 'var(--gn2)' : 'var(--s1)'};border:1.5px solid ${done ? 'rgba(34,197,94,.3)' : 'var(--bd)'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
  <span style="color:${done ? 'var(--gn)' : 'var(--t3)'};font-size:16px">${done ? '✓' : '○'}</span>
</div>
</div>`;
  });
  return html + '</div>';
}

// ── HANDLERS ──────────────────────────────────────────────────────────────────
function prevWeek() { weekOffset--; renderWeek(); }
function nextWeek() { if (weekOffset < 0) { weekOffset++; renderWeek(); } }

function openWorkout(dateKey, dayNum) {
  openDate   = dateKey;
  openDay    = dayNum;
  expandedId = null;
  renderWorkout();
  document.getElementById('vo').classList.remove('off');
  document.getElementById('vw').style.pointerEvents = 'none';
}

function closeWorkout() {
  document.getElementById('vo').classList.add('off');
  document.getElementById('vw').style.pointerEvents = '';
  openDate   = null;
  openDay    = null;
  expandedId = null;
  renderWeek();
}

function toggleExercise(id) {
  expandedId = expandedId === id ? null : id;
  reRenderWorkout();
}

function onWeightInput(ev, exId, setIndex) {
  updateSet(openDate, PLAN[openDay].key, exId, setIndex, 'w', ev.target.value);
}
function onRepsInput(ev, exId, setIndex) {
  updateSet(openDate, PLAN[openDay].key, exId, setIndex, 'r', ev.target.value);
}

function toggleSetDone(exId, setIndex) {
  toggleSetCompleted(openDate, PLAN[openDay].key, exId, setIndex);
  reRenderWorkout();
}

function completeWorkout() {
  markWorkoutDone(openDate, PLAN[openDay].key);
  reRenderWorkout();
}

function reRenderWorkout() {
  const el        = document.getElementById('vo');
  const scrollTop = el.scrollTop;
  renderWorkout();
  requestAnimationFrame(() => { el.scrollTop = scrollTop; });
}

// ── INIT ──────────────────────────────────────────────────────────────────────
// Generate a canvas-based apple-touch-icon for the home screen tile.
(function generateIcon() {
  try {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0C0F14';
    ctx.fillRect(0, 0, 512, 512);
    ctx.fillStyle = '#FF6B35';
    ctx.beginPath(); ctx.ellipse(108, 256, 76, 110, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(404, 256, 76, 110, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(184, 228, 144, 56);
    ctx.fillStyle = '#CC4A20';
    ctx.fillRect(180, 224, 22, 64);
    ctx.fillRect(310, 224, 22, 64);
    const link = document.createElement('link');
    link.rel  = 'apple-touch-icon';
    link.href = canvas.toDataURL('image/png');
    document.head.appendChild(link);
  } catch {}
})();

// Register service worker — enables offline use after the first online load.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

renderWeek();
</script>
</body>
